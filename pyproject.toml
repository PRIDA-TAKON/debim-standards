[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debim-standards"
version = "0.1.0"
description = "Open Data Standards, Human Scale Anthropometrics, Building Codes, and Material Catalogs for debim Declarative BIM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PRIDA-TAKON" }
]
keywords = [
    "bim",
    "building-as-code",
    "human-scale",
    "anthropometrics",
    "neufert",
    "building-codes",
    "materials",
    "open-data",
    "debim",
    "cgd-v480"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
